<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时间与课程新词乐园</title>
  <link rel="icon" type="image/svg+xml" sizes="32x32" href="./favicon.svg" />
  <style>
    :root {
      --bg: #fff9ef;
      --panel: rgba(255, 255, 255, 0.82);
      --ink: #1e2b3a;
      --muted: #5d6a78;
      --orange: #ff8a3d;
      --yellow: #ffd45b;
      --green: #7cd992;
      --blue: #77b8ff;
      --pink: #ff93b6;
      --line: rgba(30, 43, 58, 0.12);
      --shadow: 0 24px 60px rgba(255, 138, 61, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 92px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 212, 91, 0.75), transparent 30%),
        radial-gradient(circle at top right, rgba(119, 184, 255, 0.65), transparent 28%),
        radial-gradient(circle at bottom left, rgba(255, 147, 182, 0.45), transparent 25%),
        linear-gradient(180deg, #fff7df 0%, #fffdf7 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      border-radius: 999px;
      opacity: 0.18;
      pointer-events: none;
      filter: blur(3px);
    }

    body::before {
      width: 220px;
      height: 220px;
      top: 90px;
      left: -80px;
      background: repeating-radial-gradient(circle, #ff8a3d 0 16px, transparent 16px 32px);
      transform: rotate(18deg);
    }

    body::after {
      width: 260px;
      height: 260px;
      right: -100px;
      bottom: 70px;
      background: repeating-linear-gradient(45deg, #77b8ff 0 16px, transparent 16px 32px);
    }

    .page {
      width: min(980px, calc(100% - 24px));
      margin: 18px auto 28px;
    }

    .hero {
      padding: 12px 14px;
      border: 3px solid rgba(30, 43, 58, 0.08);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.86), rgba(255,248,230,0.86));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hero-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid rgba(30, 43, 58, 0.08);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3.5vw, 34px);
      line-height: 1;
    }

    .hero p {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(72px, 1fr));
      gap: 8px;
      min-width: min(100%, 228px);
    }

    .stat {
      padding: 10px 8px;
      border-radius: 16px;
      background: #fff;
      border: 2px solid rgba(30, 43, 58, 0.08);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }

    .stat span {
      font-size: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      margin-top: 10px;
    }

    .panel {
      padding: 16px;
      border-radius: 20px;
      background: var(--panel);
      border: 2px solid rgba(30, 43, 58, 0.08);
    }

    .panel.collapsible {
      padding: 0;
      overflow: hidden;
    }

    .panel-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }

    .panel-toggle-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: transparent;
      border: 0;
      font-weight: 800;
      text-align: left;
      padding: 0;
    }

    .panel-toggle .toggle-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .panel-toggle .toggle-icon {
      font-size: 18px;
      transition: transform 160ms ease;
    }

    .panel.collapsible.open .toggle-icon {
      transform: rotate(180deg);
    }

    .panel-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 2px solid rgba(30, 43, 58, 0.06);
    }

    .panel.collapsible.open .panel-body {
      display: block;
    }

    .search {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .search input {
      flex: 1;
      min-width: 180px;
      border: 2px solid rgba(30, 43, 58, 0.12);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      outline: none;
    }

    .chip-row,
    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
      color: var(--ink);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .chip,
    .action {
      border-radius: 999px;
      padding: 10px 15px;
      font-weight: 700;
    }

    .chip {
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(30, 43, 58, 0.08);
    }

    .chip.active {
      background: var(--yellow);
    }

    .action {
      background: linear-gradient(180deg, #ffffff, #fff2d2);
      border: 2px solid rgba(30, 43, 58, 0.1);
      box-shadow: 0 8px 18px rgba(255, 138, 61, 0.12);
    }

    .action.primary {
      background: linear-gradient(180deg, #ffb15b, #ff8a3d);
      color: #fff;
    }

    .action.secondary {
      background: linear-gradient(180deg, #f7fbff, #e8f2ff);
      color: #35516a;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .switch input {
      width: 20px;
      height: 20px;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 14px;
      margin-top: 14px;
      align-items: start;
    }

    .card {
      position: relative;
      min-height: 560px;
      border-radius: 28px;
      overflow: hidden;
      padding: 22px;
      background: linear-gradient(160deg, rgba(255,255,255,0.98), rgba(255,247,221,0.98));
      border: 3px solid rgba(30, 43, 58, 0.08);
      box-shadow: var(--shadow);
    }

    .ribbon {
      position: absolute;
      right: 20px;
      top: 18px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid rgba(30, 43, 58, 0.08);
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }

    .scene {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 260px;
      margin-bottom: 20px;
      border-radius: 24px;
      overflow: hidden;
      background: var(--scene-bg, linear-gradient(135deg, #dff4ff, #fef2c5));
    }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: 0.22;
    }

    .scene::before {
      width: 180px;
      height: 180px;
      background: #fff;
      top: -50px;
      right: -36px;
    }

    .scene::after {
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.65);
      bottom: -30px;
      left: -10px;
    }

    .emoji {
      position: relative;
      z-index: 1;
      font-size: clamp(96px, 18vw, 150px);
      filter: drop-shadow(0 12px 18px rgba(30, 43, 58, 0.16));
      animation: floaty 2.8s ease-in-out infinite;
      user-select: none;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .word {
      font-size: clamp(56px, 7vw, 88px);
      line-height: 1;
      margin: 8px 0 0;
    }

    .phonetic {
      margin: 8px 0 18px;
      font-size: 22px;
      color: #507087;
      font-weight: 700;
    }

    .meaning {
      font-size: 32px;
      line-height: 1.5;
      margin: 0 0 18px;
      min-height: 96px;
    }

    .mini-note {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.78);
      border: 2px dashed rgba(30, 43, 58, 0.12);
      color: var(--muted);
      font-weight: 600;
    }

    .card-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0 12px;
    }

    .status-pill,
    .pill-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(30, 43, 58, 0.08);
      color: #4b6478;
    }

    .status-pill.danger,
    .pill-badge.danger {
      background: #ffe0cb;
      color: #a64f21;
      border-color: rgba(255, 138, 61, 0.22);
    }

    .note-panel {
      margin-top: 14px;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.78);
      border: 2px solid rgba(30, 43, 58, 0.08);
    }

    .note-panel label {
      display: block;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .note-input {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: 2px solid rgba(30, 43, 58, 0.1);
      border-radius: 16px;
      padding: 12px 14px;
      font: inherit;
      color: var(--ink);
      background: rgba(255,255,255,0.96);
      outline: none;
    }

    .note-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .side h3,
    .list-panel h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .quiz-box {
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(124, 217, 146, 0.24), rgba(255, 255, 255, 0.8));
      border: 2px solid rgba(30, 43, 58, 0.08);
      margin-bottom: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-action {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-weight: 700;
      padding: 0;
    }

    .quiz-word {
      margin: 12px 0;
      font-size: 32px;
      font-weight: 900;
    }

    .quiz-answer {
      min-height: 26px;
      color: var(--muted);
      font-weight: 700;
    }

    .quiz-mode-row {
      margin: 10px 0 12px;
    }

    .quiz-mode-hint {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 600;
    }

    .quiz-tools {
      margin: 12px 0;
    }

    .quiz-note-panel {
      margin-top: 12px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.72);
      border: 2px solid rgba(30, 43, 58, 0.08);
    }

    .quiz-note-panel label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .quiz-note-input {
      width: 100%;
      min-height: 78px;
      resize: vertical;
      border: 2px solid rgba(30, 43, 58, 0.1);
      border-radius: 14px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: rgba(255,255,255,0.96);
      outline: none;
    }

    .list-panel {
      margin-top: 0;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .list-toggle {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-weight: 700;
      padding: 0;
    }

    .solo-hidden {
      display: none !important;
    }

    .word-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
      max-height: 420px;
      overflow: auto;
    }

    .list-panel.collapsed .word-list,
    .list-panel.collapsed .footer-tip {
      display: none;
    }

    .word-pill {
      text-align: left;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(30, 43, 58, 0.08);
    }

    .word-pill.active {
      background: #ffe69d;
      border-color: rgba(255, 138, 61, 0.24);
    }

    .word-pill strong {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .pill-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .pill-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .word-pill span {
      display: block;
    }

    .footer-tip {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .site-nav {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 30;
      width: min(960px, calc(100% - 18px));
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid rgba(30, 43, 58, 0.08);
      box-shadow: 0 18px 40px rgba(30, 43, 58, 0.12);
      backdrop-filter: blur(12px);
    }

    .site-nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 16px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      border: 2px solid rgba(30, 43, 58, 0.06);
    }

    .site-nav a.active {
      color: var(--ink);
      background: linear-gradient(180deg, #ffe590, #ffd45b);
    }

    @media (max-width: 900px) {
      .stage {
        grid-template-columns: 1fr;
      }

      .stats {
        width: 100%;
      }

      .card {
        min-height: auto;
      }

      .word-list {
        max-height: none;
      }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 16px, 1120px);
        margin: 16px auto 28px;
      }

      .hero,
      .card,
      .panel {
        padding: 18px;
        border-radius: 22px;
      }

      .hero {
        padding: 10px 12px;
      }

      .meaning {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-top">
        <div class="hero-title">
          <span class="badge">句子里提炼的 40 个新词</span>
          <h1>时间与课程新词乐园</h1>
        </div>
        <div class="stats">
          <div class="stat">
            <strong id="totalCount">40</strong>
            <span>总单词</span>
          </div>
          <div class="stat">
            <strong id="shownCount">40</strong>
            <span>当前显示</span>
          </div>
          <div class="stat">
            <strong id="currentIndexLabel">1 / 40</strong>
            <span>学习进度</span>
          </div>
        </div>
        <div class="section-actions">
          <a class="action secondary" href="./index.html" style="text-decoration:none;">旧单词页</a>
          <a class="action secondary" href="./unit2-time-routines.html" style="text-decoration:none;">句子练习页</a>
          <button class="action" id="toggleSettingsBtn" type="button">学习设置</button>
        </div>
      </div>

      <div class="controls">
        <div class="panel collapsible focusable-section" id="settingsPanel">
          <div class="panel-toggle">
            <button class="panel-toggle-btn" id="settingsSummary" type="button">
              <span>
                学习设置
                <span class="toggle-meta">搜索、分类、发音和显示规则</span>
              </span>
              <span class="toggle-icon">▾</span>
            </button>
            <button class="mini-action" id="focusSettingsBtn" type="button">只看此板块</button>
          </div>
          <div class="panel-body">
            <div class="search" style="margin-top: 14px;">
              <input id="searchInput" type="text" placeholder="搜索英文或中文，例如 breakfast / late / class" />
            </div>
            <div class="chip-row" id="categoryChips"></div>
            <label class="switch">
              <input id="autoSpeak" type="checkbox" checked />
              <span>切换单词时自动朗读英文</span>
            </label>
            <label class="switch">
              <input id="alwaysShowMeaning" type="checkbox" />
              <span>默认显示中文意思</span>
            </label>
          </div>
        </div>

      </div>
    </section>

    <section class="stage">
      <article class="card focusable-section" id="cardSection">
        <div class="section-header">
          <span class="ribbon" id="categoryLabel">分类</span>
          <button class="mini-action" id="focusCardBtn" type="button">只看此板块</button>
        </div>
        <div class="scene" id="scene">
          <div class="emoji" id="emojiBox">⏰</div>
        </div>
        <h2 class="word" id="wordText">breakfast</h2>
        <div class="phonetic" id="phoneticText">/ˈbrekfəst/</div>
        <p class="meaning" id="meaningText">早餐</p>
        <div class="mini-note" id="hintText">这页的词来自句子内容，适合先记关键词，再回去练整句。</div>
        <div class="card-tools">
          <button class="action secondary" id="mistakeBtn" type="button">标记为易错词</button>
          <span class="status-pill" id="mistakeStatus">未标记易错</span>
        </div>
        <div class="note-panel">
          <label for="wordNoteInput">这个单词的小备注</label>
          <textarea class="note-input" id="wordNoteInput" placeholder="可以记：容易混淆的词、自己的例句、记忆方法……"></textarea>
          <div class="note-meta" id="wordNoteMeta">自动保存到本机浏览器。</div>
        </div>
        <div class="button-row" style="margin-top: 20px;">
          <button class="action" id="prevBtn">上一个</button>
          <button class="action primary" id="speakBtn">发音</button>
          <button class="action" id="nextBtn">下一个</button>
          <button class="action" id="randomBtn">随机抽词</button>
          <button class="action" id="flipBtn">看答案</button>
        </div>
      </article>

      <aside class="side">
        <div class="quiz-box focusable-section" id="quizSection">
          <div class="section-header">
            <h3>小测验</h3>
            <button class="mini-action" id="focusQuizBtn" type="button">只看此板块</button>
          </div>
          <div class="chip-row quiz-mode-row" id="quizModeChips"></div>
          <p class="quiz-mode-hint" id="quizModeHint">默认测验全部单词，同一轮里尽量不重复。</p>
          <div class="quiz-word" id="quizWord">按“来一题小测验”开始</div>
          <div class="button-row">
            <button class="action" id="quizBtn">来一题</button>
            <button class="action primary" id="showQuizAnswerBtn">显示答案</button>
            <button class="action" id="speakQuizBtn">朗读题目</button>
          </div>
          <p class="quiz-answer" id="quizAnswer"></p>
          <div class="card-tools quiz-tools">
            <button class="action secondary" id="quizMistakeBtn" type="button">标记为易错词</button>
            <span class="status-pill" id="quizMistakeStatus">未标记易错</span>
          </div>
          <div class="quiz-note-panel">
            <label for="quizWordNoteInput">这道题的备注</label>
            <textarea class="quiz-note-input" id="quizWordNoteInput" placeholder="给当前测验单词记一点提示……"></textarea>
            <div class="note-meta" id="quizWordNoteMeta">自动保存到本机浏览器。</div>
          </div>
          <label class="switch">
            <input id="autoSpeakQuiz" type="checkbox" checked />
            <span>新题默认发音</span>
          </label>
        </div>

        <div class="panel list-panel focusable-section" id="listSection">
          <div class="list-header">
            <h3>当前词表</h3>
            <div class="section-actions">
              <button class="mini-action" id="focusListBtn" type="button">只看此板块</button>
              <button class="list-toggle" id="toggleWordListBtn" type="button">收起</button>
            </div>
          </div>
          <div class="word-list" id="wordList"></div>

    const storagePrefix = `englishstudy:${location.pathname.split("/").pop()}`;
    const mistakeStorageKey = `${storagePrefix}:mistakes`;
    const noteStorageKey = `${storagePrefix}:notes`;
    let mistakeMap = loadStoredObject(mistakeStorageKey);
    let noteMap = loadStoredObject(noteStorageKey);

    function loadStoredObject(key) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        return {};
      }
    }

    function saveStoredObject(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        console.warn(`保存 ${key} 失败`, error);
      }
    }

    function isMistakeWord(id) {
      return Boolean(mistakeMap[id]);
    }

    function getWordNote(id) {
      return noteMap[id] || "";
    }

    function setWordNote(id, value) {
      const text = value.trim();
      if (text) {
        noteMap[id] = text;
      } else {
        delete noteMap[id];
      }
      saveStoredObject(noteStorageKey, noteMap);
    }

    function invalidateQuizPools() {
      quizPools = { all: [], mistakes: [] };
    }

    function shuffle(items) {
      const list = [...items];
      for (let index = list.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [list[index], list[swapIndex]] = [list[swapIndex], list[index]];
      }
      return list;
    }

    function getMistakeWords() {
      return filteredWords.filter(item => isMistakeWord(item.id));
    }

    function getQuizCandidates(mode = quizMode) {
      return mode === "mistakes" ? getMistakeWords() : filteredWords;
    }

    function ensureQuizPool(mode = quizMode) {
      const candidates = getQuizCandidates(mode);
      if (!candidates.length) {
        quizPools[mode] = [];
        return;
      }
      if (quizPools[mode].length) return;
      const nextPool = shuffle(candidates.map(item => item.id));
      const lastId = quizLastWordId[mode];
      if (nextPool.length > 1 && nextPool[0] === lastId) {
        [nextPool[0], nextPool[1]] = [nextPool[1], nextPool[0]];
      }
      quizPools[mode] = nextPool;
    }

    function updateQuizModeHint() {
      const allCount = filteredWords.length;
      const mistakeCount = getMistakeWords().length;

        quizModeHint.textContent = mistakeCount
          ? `当前测验已标记的易错词，共 ${mistakeCount} 个；同一轮会尽量不重复。`
          : "当前是易错词模式，但还没有已标记的易错词。先在单词卡里点“标记为易错词”。";
      } else {
        quizModeHint.textContent = allCount
          ? `当前测验全部单词，共 ${allCount} 个；同一轮会尽量不重复。`
          : "当前没有可测验的单词，试试清空搜索或切换分类。";
      }
    }

      quizMistakeBtn.textContent = isMistakeWord(item.id) ? "取消易错标记" : "标记为易错词";

      quizMistakeStatus.className = `status-pill${isMistakeWord(item.id) ? " danger" : ""}`;
      quizWordNoteInput.value = getWordNote(item.id);
      quizWordNoteMeta.textContent = getWordNote(item.id) ? "备注已自动保存到本机浏览器。" : "自动保存到本机浏览器。";
    }

      const modes = [
        { value: "all", label: `全部单词 ${filteredWords.length}` },
        { value: "mistakes", label: `易错单词 ${mistakeCount}` }
      ];
      quizModeChips.innerHTML = "";
      modes.forEach(mode => {
        const chip = document.createElement("button");
        chip.className = `chip${quizMode === mode.value ? " active" : ""}`;
        chip.type = "button";

          quizMode = mode.value;
          updateQuizModeHint();
          renderQuizModeChips();
          makeQuiz();
        });
        quizModeChips.appendChild(chip);

    }

      settingsPanel.classList.toggle("solo-hidden", !!soloSection && soloSection !== "settings");

      listSection.classList.toggle("solo-hidden", !!soloSection && soloSection !== "list");
      updateSoloButtons();
    }

    function syncMeaningMode(resetIfNeeded = false) {
      if (alwaysShowMeaning.checked) {
        meaningVisible = true;
      } else if (resetIfNeeded) {
        meaningVisible = false;
      }
      document.getElementById("flipBtn").textContent = meaningVisible ? "藏起来" : "看答案";
    }

    function setupVoices() {
      cachedVoices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      voicesReady = cachedVoices.length > 0;
    }

    if ("speechSynthesis" in window) {
      setupVoices();
      speechSynthesis.onvoiceschanged = setupVoices;
    }

    function getBestVoice() {
      if (!cachedVoices.length) return null;
      return (
        cachedVoices.find(v => /en-(gb|us)/i.test(v.lang) && /Google|Samantha|Daniel|Serena/i.test(v.name)) ||
        cachedVoices.find(v => /en/i.test(v.lang)) ||
        cachedVoices[0]
      );
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        alert("当前浏览器不支持语音朗读。建议用 Chrome 打开。");
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      const voice = getBestVoice();
      if (voice) utterance.voice = voice;
      utterance.lang = voice?.lang || "en-US";
      utterance.rate = 0.86;
      utterance.pitch = 1.05;
      utterance.volume = 1;
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    function normalize(value) {
      return value.toLowerCase().trim();
    }

    function getFilteredWords() {
      const q = normalize(keyword);
      return words.filter(item => {
        const categoryOk = selectedCategory === "全部" || item.category === selectedCategory;
        const searchOk = !q || item.en.toLowerCase().includes(q) || item.zh.includes(q) || item.phonetic.toLowerCase().includes(q);
        return categoryOk && searchOk;
      });
    }

      shownCount.textContent = filteredWords.length;

        const badges = [];
        if (isMistakeWord(item.id)) badges.push('<span class="pill-badge danger">易错</span>');
        if (getWordNote(item.id)) badges.push('<span class="pill-badge">有备注</span>');
        button.innerHTML = `
          <div class="pill-head">
            <strong>${item.en}</strong>
            <div class="pill-badges">${badges.join("")}</div>
          </div>
          <span>${item.zh}</span>
        `;
        button.addEventListener("click", () => {
          currentIndex = index;
          syncMeaningMode(true);
          renderCard();
          renderWordList();
          updateStats();
          maybeSpeakCurrent();
        });
        wordList.appendChild(button);
      });
    }

    function renderCard() {
      const item = filteredWords[currentIndex];
      if (!item) {
        categoryLabel.textContent = "没有结果";
        scene.style.setProperty("--scene-bg", "linear-gradient(135deg, #f0f0f0, #fafafa)");
        emojiBox.textContent = "🔍";
        wordText.textContent = "No match";
        phoneticText.textContent = "";
        meaningText.textContent = "没有找到匹配的单词";
        hintText.textContent = "试试清空搜索或切换分类。";
        mistakeBtn.textContent = "标记为易错词";
        mistakeStatus.textContent = "未标记易错";
        mistakeStatus.className = "status-pill";
        wordNoteInput.value = "";
        wordNoteMeta.textContent = "自动保存到本机浏览器。";
        return;
      }

      categoryLabel.textContent = `${item.category} · #${item.id}`;
      scene.style.setProperty("--scene-bg", item.scene);
      emojiBox.textContent = item.emoji;
      wordText.textContent = item.en;
      phoneticText.textContent = item.phonetic;
      meaningText.textContent = meaningVisible ? item.zh : "先自己想一想中文意思";
      hintText.textContent = meaningVisible ? item.hint : "先听一听发音，再猜猜它的中文意思。";
      mistakeBtn.textContent = isMistakeWord(item.id) ? "取消易错标记" : "标记为易错词";
      mistakeStatus.textContent = isMistakeWord(item.id) ? "已标记为易错词" : "未标记易错";
      mistakeStatus.className = `status-pill${isMistakeWord(item.id) ? " danger" : ""}`;
      wordNoteInput.value = getWordNote(item.id);
      wordNoteMeta.textContent = getWordNote(item.id) ? "备注已自动保存到本机浏览器。" : "自动保存到本机浏览器。";
    }

    function renderAll() {
      filteredWords = getFilteredWords();
      if (currentIndex >= filteredWords.length) currentIndex = 0;
      invalidateQuizPools();
      syncMeaningMode();
      renderCategoryChips();
      renderCard();
      renderWordList();
      updateStats();
      renderQuizModeChips();
      updateQuizModeHint();
    }

    function maybeSpeakCurrent(force = false) {
      if (!force && !autoSpeak.checked) return;
      const item = filteredWords[currentIndex];
      if (item) speak(item.en);
    }

    function move(step) {
      if (!filteredWords.length) return;
      currentIndex = (currentIndex + step + filteredWords.length) % filteredWords.length;
      syncMeaningMode(true);
      renderCard();
      renderWordList();
      updateStats();
      maybeSpeakCurrent(true);
    }

    function randomPick() {
      if (!filteredWords.length) return;
      currentIndex = Math.floor(Math.random() * filteredWords.length);
      syncMeaningMode(true);
      renderCard();
      renderWordList();
      updateStats();
      maybeSpeakCurrent(true);
    }

    function makeQuiz() {
      ensureQuizPool(quizMode);
      const nextId = quizPools[quizMode].shift();
      const item = getQuizCandidates(quizMode).find(word => word.id === nextId);
      if (!item) {
        quizWord.textContent = quizMode === "mistakes" ? "还没有易错词可测验" : "没有可测验的单词";
        quizAnswer.textContent = "";
        quizAnswer.dataset.answer = "";
        quizAnswer.dataset.word = "";
        quizAnswer.dataset.wordId = "";
        updateQuizMeta(null);
        updateQuizModeHint();
        renderQuizModeChips();
        return;
      }
      quizLastWordId[quizMode] = item.id;
      quizWord.textContent = item.en;
      quizAnswer.textContent = "";
      quizAnswer.dataset.answer = `${item.zh} ${item.phonetic}`;
      quizAnswer.dataset.word = item.en;
      quizAnswer.dataset.wordId = String(item.id);
      updateQuizMeta(item);
      updateQuizModeHint();
      renderQuizModeChips();
      if (autoSpeakQuiz.checked) speak(item.en);
    }

    function toggleCurrentMistake() {
      const item = filteredWords[currentIndex];
      if (!item) return;
      if (isMistakeWord(item.id)) {
        delete mistakeMap[item.id];
      } else {
        mistakeMap[item.id] = true;
      }
      saveStoredObject(mistakeStorageKey, mistakeMap);
      invalidateQuizPools();
      renderCard();
      renderWordList();
      renderQuizModeChips();
      updateQuizModeHint();
    }

    function scheduleNoteSave() {
      const item = filteredWords[currentIndex];
      if (!item) return;
      const noteValue = wordNoteInput.value;
      clearTimeout(noteSaveTimer);
      noteSaveTimer = setTimeout(() => {
        setWordNote(item.id, noteValue);
        wordNoteMeta.textContent = noteValue.trim() ? "备注已自动保存到本机浏览器。" : "自动保存到本机浏览器。";
        renderWordList();
      }, 220);
    }

    function toggleQuizMistake() {
      const item = getWordById(quizAnswer.dataset.wordId);
      if (!item) return;
      if (isMistakeWord(item.id)) {
        delete mistakeMap[item.id];
      } else {
        mistakeMap[item.id] = true;
      }
      saveStoredObject(mistakeStorageKey, mistakeMap);
      invalidateQuizPools();
      renderCard();
      renderWordList();
      renderQuizModeChips();
      updateQuizModeHint();
      updateQuizMeta(item);
    }

    function scheduleQuizNoteSave() {
      const item = getWordById(quizAnswer.dataset.wordId);
      if (!item) return;
      const noteValue = quizWordNoteInput.value;
      clearTimeout(quizNoteSaveTimer);
      quizNoteSaveTimer = setTimeout(() => {
        setWordNote(item.id, noteValue);
        quizWordNoteMeta.textContent = noteValue.trim() ? "备注已自动保存到本机浏览器。" : "自动保存到本机浏览器。";
        renderCard();
        renderWordList();
        updateQuizMeta(item);
      }, 220);
    }

    searchInput.addEventListener("input", (event) => {
      keyword = event.target.value;
      currentIndex = 0;
      syncMeaningMode(true);
      renderAll();
    });

    alwaysShowMeaning.addEventListener("change", () => {
      syncMeaningMode();
      renderCard();
    });

    settingsSummary.addEventListener("click", () => {
      setSettingsOpen(!settingsOpen);
    });

    toggleSettingsBtn.addEventListener("click", () => {
      setSettingsOpen(!settingsOpen);
    });

    focusSettingsBtn.addEventListener("click", () => {
      setSoloSection("settings");
    });

    focusCardBtn.addEventListener("click", () => {
      setSoloSection("card");
    });

    focusQuizBtn.addEventListener("click", () => {
      setSoloSection("quiz");
    });

    focusListBtn.addEventListener("click", () => {
      setSoloSection("list");
    });

    toggleWordListBtn.addEventListener("click", () => {
      setWordListOpen(!wordListOpen);
    });

    document.getElementById("prevBtn").addEventListener("click", () => move(-1));
    document.getElementById("nextBtn").addEventListener("click", () => move(1));
    document.getElementById("randomBtn").addEventListener("click", randomPick);
    document.getElementById("speakBtn").addEventListener("click", () => {
      const item = filteredWords[currentIndex];
      if (item) speak(item.en);
    });
    mistakeBtn.addEventListener("click", toggleCurrentMistake);
    wordNoteInput.addEventListener("input", scheduleNoteSave);
    wordNoteInput.addEventListener("blur", scheduleNoteSave);
    quizMistakeBtn.addEventListener("click", toggleQuizMistake);
    quizWordNoteInput.addEventListener("input", scheduleQuizNoteSave);
    quizWordNoteInput.addEventListener("blur", scheduleQuizNoteSave);

    document.getElementById("flipBtn").addEventListener("click", () => {
      meaningVisible = !meaningVisible;
      if (alwaysShowMeaning.checked) {
        meaningVisible = true;
      }
      syncMeaningMode();
      renderCard();
    });

    document.getElementById("quizBtn").addEventListener("click", makeQuiz);
    document.getElementById("showQuizAnswerBtn").addEventListener("click", () => {
      quizAnswer.textContent = quizAnswer.dataset.answer || "先出一道题。";
    });
    document.getElementById("speakQuizBtn").addEventListener("click", () => {
      const word = quizAnswer.dataset.word || quizWord.textContent;
      if (word && word !== "按“来一题小测验”开始") speak(word);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
      if (event.key.toLowerCase() === "s") {
        const item = filteredWords[currentIndex];
        if (item) speak(item.en);
      }
    });

    renderAll();
    makeQuiz();
    syncMeaningMode();
    setSettingsOpen(false);
    setWordListOpen(true);
    updateSoloButtons();
    if (voicesReady) {
      setTimeout(maybeSpeakCurrent, 500);
    }
  </script>
</body>
</html>
