<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时间与课程新词乐园</title>
  <style>
    :root {
      --bg: #fff9ef;
      --panel: rgba(255, 255, 255, 0.82);
      --ink: #1e2b3a;
      --muted: #5d6a78;
      --orange: #ff8a3d;
      --yellow: #ffd45b;
      --green: #7cd992;
      --blue: #77b8ff;
      --pink: #ff93b6;
      --line: rgba(30, 43, 58, 0.12);
      --shadow: 0 24px 60px rgba(255, 138, 61, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 212, 91, 0.75), transparent 30%),
        radial-gradient(circle at top right, rgba(119, 184, 255, 0.65), transparent 28%),
        radial-gradient(circle at bottom left, rgba(255, 147, 182, 0.45), transparent 25%),
        linear-gradient(180deg, #fff7df 0%, #fffdf7 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      border-radius: 999px;
      opacity: 0.18;
      pointer-events: none;
      filter: blur(3px);
    }

    body::before {
      width: 220px;
      height: 220px;
      top: 90px;
      left: -80px;
      background: repeating-radial-gradient(circle, #ff8a3d 0 16px, transparent 16px 32px);
      transform: rotate(18deg);
    }

    body::after {
      width: 260px;
      height: 260px;
      right: -100px;
      bottom: 70px;
      background: repeating-linear-gradient(45deg, #77b8ff 0 16px, transparent 16px 32px);
    }

    .page {
      width: min(980px, calc(100% - 24px));
      margin: 18px auto 28px;
    }

    .hero {
      padding: 12px 14px;
      border: 3px solid rgba(30, 43, 58, 0.08);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.86), rgba(255,248,230,0.86));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hero-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid rgba(30, 43, 58, 0.08);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3.5vw, 34px);
      line-height: 1;
    }

    .hero p {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(72px, 1fr));
      gap: 8px;
      min-width: min(100%, 228px);
    }

    .stat {
      padding: 10px 8px;
      border-radius: 16px;
      background: #fff;
      border: 2px solid rgba(30, 43, 58, 0.08);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }

    .stat span {
      font-size: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      margin-top: 10px;
    }

    .panel {
      padding: 16px;
      border-radius: 20px;
      background: var(--panel);
      border: 2px solid rgba(30, 43, 58, 0.08);
    }

    .panel.collapsible {
      padding: 0;
      overflow: hidden;
    }

    .panel-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }

    .panel-toggle-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: transparent;
      border: 0;
      font-weight: 800;
      text-align: left;
      padding: 0;
    }

    .panel-toggle .toggle-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .panel-toggle .toggle-icon {
      font-size: 18px;
      transition: transform 160ms ease;
    }

    .panel.collapsible.open .toggle-icon {
      transform: rotate(180deg);
    }

    .panel-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 2px solid rgba(30, 43, 58, 0.06);
    }

    .panel.collapsible.open .panel-body {
      display: block;
    }

    .search {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .search input {
      flex: 1;
      min-width: 180px;
      border: 2px solid rgba(30, 43, 58, 0.12);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      outline: none;
    }

    .chip-row,
    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
      color: var(--ink);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .chip,
    .action {
      border-radius: 999px;
      padding: 10px 15px;
      font-weight: 700;
    }

    .chip {
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(30, 43, 58, 0.08);
    }

    .chip.active {
      background: var(--yellow);
    }

    .action {
      background: linear-gradient(180deg, #ffffff, #fff2d2);
      border: 2px solid rgba(30, 43, 58, 0.1);
      box-shadow: 0 8px 18px rgba(255, 138, 61, 0.12);
    }

    .action.primary {
      background: linear-gradient(180deg, #ffb15b, #ff8a3d);
      color: #fff;
    }

    .action.secondary {
      background: linear-gradient(180deg, #f7fbff, #e8f2ff);
      color: #35516a;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .switch input {
      width: 20px;
      height: 20px;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 14px;
      margin-top: 14px;
      align-items: start;
    }

    .card {
      position: relative;
      min-height: 560px;
      border-radius: 28px;
      overflow: hidden;
      padding: 22px;
      background: linear-gradient(160deg, rgba(255,255,255,0.98), rgba(255,247,221,0.98));
      border: 3px solid rgba(30, 43, 58, 0.08);
      box-shadow: var(--shadow);
    }

    .ribbon {
      position: absolute;
      right: 20px;
      top: 18px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid rgba(30, 43, 58, 0.08);
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }

    .scene {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 260px;
      margin-bottom: 20px;
      border-radius: 24px;
      overflow: hidden;
      background: var(--scene-bg, linear-gradient(135deg, #dff4ff, #fef2c5));
    }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: 0.22;
    }

    .scene::before {
      width: 180px;
      height: 180px;
      background: #fff;
      top: -50px;
      right: -36px;
    }

    .scene::after {
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.65);
      bottom: -30px;
      left: -10px;
    }

    .emoji {
      position: relative;
      z-index: 1;
      font-size: clamp(96px, 18vw, 150px);
      filter: drop-shadow(0 12px 18px rgba(30, 43, 58, 0.16));
      animation: floaty 2.8s ease-in-out infinite;
      user-select: none;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .word {
      font-size: clamp(56px, 7vw, 88px);
      line-height: 1;
      margin: 8px 0 0;
    }

    .phonetic {
      margin: 8px 0 18px;
      font-size: 22px;
      color: #507087;
      font-weight: 700;
    }

    .meaning {
      font-size: 32px;
      line-height: 1.5;
      margin: 0 0 18px;
      min-height: 96px;
    }

    .mini-note {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.78);
      border: 2px dashed rgba(30, 43, 58, 0.12);
      color: var(--muted);
      font-weight: 600;
    }

    .side h3,
    .list-panel h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .quiz-box {
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(124, 217, 146, 0.24), rgba(255, 255, 255, 0.8));
      border: 2px solid rgba(30, 43, 58, 0.08);
      margin-bottom: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-action {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-weight: 700;
      padding: 0;
    }

    .quiz-word {
      margin: 12px 0;
      font-size: 32px;
      font-weight: 900;
    }

    .quiz-answer {
      min-height: 26px;
      color: var(--muted);
      font-weight: 700;
    }

    .list-panel {
      margin-top: 0;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .list-toggle {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-weight: 700;
      padding: 0;
    }

    .solo-hidden {
      display: none !important;
    }

    .word-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
      max-height: 420px;
      overflow: auto;
    }

    .list-panel.collapsed .word-list,
    .list-panel.collapsed .footer-tip {
      display: none;
    }

    .word-pill {
      text-align: left;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(30, 43, 58, 0.08);
    }

    .word-pill.active {
      background: #ffe69d;
      border-color: rgba(255, 138, 61, 0.24);
    }

    .word-pill strong {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .footer-tip {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .stage {
        grid-template-columns: 1fr;
      }

      .stats {
        width: 100%;
      }

      .card {
        min-height: auto;
      }

      .word-list {
        max-height: none;
      }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 16px, 1120px);
        margin: 16px auto 28px;
      }

      .hero,
      .card,
      .panel {
        padding: 18px;
        border-radius: 22px;
      }

      .hero {
        padding: 10px 12px;
      }

      .meaning {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-top">
        <div class="hero-title">
          <span class="badge">句子里提炼的 20 个新词</span>
          <h1>时间与课程新词乐园</h1>
        </div>
        <div class="stats">
          <div class="stat">
            <strong id="totalCount">20</strong>
            <span>总单词</span>
          </div>
          <div class="stat">
            <strong id="shownCount">20</strong>
            <span>当前显示</span>
          </div>
          <div class="stat">
            <strong id="currentIndexLabel">1 / 20</strong>
            <span>学习进度</span>
          </div>
        </div>
        <div class="section-actions">
          <a class="action secondary" href="./index.html" style="text-decoration:none;">旧单词页</a>
          <a class="action secondary" href="./unit2-time-routines.html" style="text-decoration:none;">句子练习页</a>
          <button class="action" id="toggleSettingsBtn" type="button">学习设置</button>
        </div>
      </div>

      <div class="controls">
        <div class="panel collapsible focusable-section" id="settingsPanel">
          <div class="panel-toggle">
            <button class="panel-toggle-btn" id="settingsSummary" type="button">
              <span>
                学习设置
                <span class="toggle-meta">搜索、分类、发音和显示规则</span>
              </span>
              <span class="toggle-icon">▾</span>
            </button>
            <button class="mini-action" id="focusSettingsBtn" type="button">只看此板块</button>
          </div>
          <div class="panel-body">
            <div class="search" style="margin-top: 14px;">
              <input id="searchInput" type="text" placeholder="搜索英文或中文，例如 breakfast / late / class" />
            </div>
            <div class="chip-row" id="categoryChips"></div>
            <label class="switch">
              <input id="autoSpeak" type="checkbox" checked />
              <span>切换单词时自动朗读英文</span>
            </label>
            <label class="switch">
              <input id="alwaysShowMeaning" type="checkbox" />
              <span>默认显示中文意思</span>
            </label>
          </div>
        </div>

      </div>
    </section>

    <section class="stage">
      <article class="card focusable-section" id="cardSection">
        <div class="section-header">
          <span class="ribbon" id="categoryLabel">分类</span>
          <button class="mini-action" id="focusCardBtn" type="button">只看此板块</button>
        </div>
        <div class="scene" id="scene">
          <div class="emoji" id="emojiBox">⏰</div>
        </div>
        <h2 class="word" id="wordText">breakfast</h2>
        <div class="phonetic" id="phoneticText">/ˈbrekfəst/</div>
        <p class="meaning" id="meaningText">早餐</p>
        <div class="mini-note" id="hintText">这页的词来自句子内容，适合先记关键词，再回去练整句。</div>
        <div class="button-row" style="margin-top: 20px;">
          <button class="action" id="prevBtn">上一个</button>
          <button class="action primary" id="speakBtn">发音</button>
          <button class="action" id="nextBtn">下一个</button>
          <button class="action" id="randomBtn">随机抽词</button>
          <button class="action" id="flipBtn">看答案</button>
        </div>
      </article>

      <aside class="side">
        <div class="quiz-box focusable-section" id="quizSection">
          <div class="section-header">
            <h3>小测验</h3>
            <button class="mini-action" id="focusQuizBtn" type="button">只看此板块</button>
          </div>
          <div class="quiz-word" id="quizWord">按“来一题小测验”开始</div>
          <div class="button-row">
            <button class="action" id="quizBtn">来一题</button>
            <button class="action primary" id="showQuizAnswerBtn">显示答案</button>
            <button class="action" id="speakQuizBtn">朗读题目</button>
          </div>
          <p class="quiz-answer" id="quizAnswer"></p>
          <label class="switch">
            <input id="autoSpeakQuiz" type="checkbox" checked />
            <span>新题默认发音</span>
          </label>
        </div>

        <div class="panel list-panel focusable-section" id="listSection">
          <div class="list-header">
            <h3>当前词表</h3>
            <div class="section-actions">
              <button class="mini-action" id="focusListBtn" type="button">只看此板块</button>
              <button class="list-toggle" id="toggleWordListBtn" type="button">收起</button>
            </div>
          </div>
          <div class="word-list" id="wordList"></div>
          <p class="footer-tip">发音使用浏览器内置 `speechSynthesis`。如果第一次没出声，先点一次“发音”，浏览器通常会初始化语音权限。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const words = [
      { id: 101, en: "breakfast", zh: "早餐", phonetic: "/ˈbrekfəst/", category: "餐食时间", emoji: "🥛", scene: "linear-gradient(135deg, #fff4bf, #ffe2a8)", hint: "早晨吃的这一餐就是 breakfast。" },
      { id: 102, en: "lunch", zh: "午餐", phonetic: "/lʌntʃ/", category: "餐食时间", emoji: "🍗", scene: "linear-gradient(135deg, #fff0c5, #ffd59e)", hint: "中午吃饭时，就是 lunch。" },
      { id: 103, en: "dinner", zh: "晚餐", phonetic: "/ˈdɪnə(r)/", category: "餐食时间", emoji: "🍚", scene: "linear-gradient(135deg, #ffe6c8, #ffd6b5)", hint: "晚上吃的正餐叫 dinner。" },
      { id: 104, en: "get up", zh: "起床", phonetic: "/get ʌp/", category: "作息动作", emoji: "⏰", scene: "linear-gradient(135deg, #e4f2ff, #cfe5ff)", hint: "闹钟响了，从床上起来就是 get up。" },
      { id: 105, en: "go to school", zh: "去上学", phonetic: "/gəʊ tə skuːl/", category: "作息动作", emoji: "🏫", scene: "linear-gradient(135deg, #dcf7e5, #c8ebd8)", hint: "背上书包出门去学校。" },
      { id: 106, en: "go home", zh: "回家", phonetic: "/gəʊ həʊm/", category: "作息动作", emoji: "🏠", scene: "linear-gradient(135deg, #ffe8d2, #ffd6c6)", hint: "放学以后回家，就是 go home。" },
      { id: 107, en: "go to bed", zh: "上床睡觉", phonetic: "/gəʊ tə bed/", category: "作息动作", emoji: "🛏️", scene: "linear-gradient(135deg, #e6e8ff, #d8d9f9)", hint: "晚上该睡觉了，可以说 go to bed。" },
      { id: 108, en: "English class", zh: "英语课", phonetic: "/ˈɪŋglɪʃ klɑːs/", category: "课程活动", emoji: "📘", scene: "linear-gradient(135deg, #dff2ff, #cfe5ff)", hint: "读和写的那节课，就是 English class。" },
      { id: 109, en: "maths class", zh: "数学课", phonetic: "/mæθs klɑːs/", category: "课程活动", emoji: "➕", scene: "linear-gradient(135deg, #e5f7ff, #d0ecff)", hint: "数数、写数字的那节课。" },
      { id: 110, en: "art class", zh: "美术课", phonetic: "/ɑːt klɑːs/", category: "课程活动", emoji: "🎨", scene: "linear-gradient(135deg, #ffe6f2, #ffd6ec)", hint: "画画的课，就是 art class。" },
      { id: 111, en: "ready", zh: "准备好了的", phonetic: "/ˈredi/", category: "课堂表达", emoji: "✅", scene: "linear-gradient(135deg, #e9ffd8, #d6f3bf)", hint: "Breakfast is ready. 或者 We're ready! 里面都有 ready。" },
      { id: 112, en: "late", zh: "迟到的；晚的", phonetic: "/leɪt/", category: "课堂表达", emoji: "⏳", scene: "linear-gradient(135deg, #fff1d8, #ffe0bf)", hint: "You're late for class. 就是在说迟到了。" },
      { id: 113, en: "class", zh: "课；课堂", phonetic: "/klɑːs/", category: "课堂表达", emoji: "🏷️", scene: "linear-gradient(135deg, #f1f5ff, #dde8ff)", hint: "English class、maths class、art class 里都有 class。" },
      { id: 114, en: "school", zh: "学校", phonetic: "/skuːl/", category: "课堂表达", emoji: "🎒", scene: "linear-gradient(135deg, #e2f7e7, #d0f0d9)", hint: "go to school 里最重要的地点词。" },
      { id: 115, en: "clock", zh: "钟；时钟", phonetic: "/klɒk/", category: "时间表达", emoji: "🕒", scene: "linear-gradient(135deg, #e1f0ff, #d1e5ff)", hint: "Look at the clock! 里的 clock 就是时钟。" },
      { id: 116, en: "time", zh: "时间；……的时候", phonetic: "/taɪm/", category: "时间表达", emoji: "⌚", scene: "linear-gradient(135deg, #fff4d6, #ffe6a6)", hint: "What time is it? 和 It's time for ... 都有 time。" },
      { id: 117, en: "read and write", zh: "读和写", phonetic: "/riːd ænd raɪt/", category: "课堂表达", emoji: "📝", scene: "linear-gradient(135deg, #edf5ff, #dcecff)", hint: "英语课里经常出现 read and write。" },
      { id: 118, en: "draw a picture", zh: "画一幅画", phonetic: "/drɔː ə ˈpɪktʃə(r)/", category: "课程活动", emoji: "🖍️", scene: "linear-gradient(135deg, #ffeaf3, #ffd8e7)", hint: "It's time for art class. Let's draw a picture." },
      { id: 119, en: "count and write", zh: "数一数并写一写", phonetic: "/kaʊnt ænd raɪt/", category: "课程活动", emoji: "🔢", scene: "linear-gradient(135deg, #e7f6ff, #d7ecff)", hint: "maths class 对应的动作就是 count and write。" },
      { id: 120, en: "have a nice day", zh: "祝你今天愉快", phonetic: "/hæv ə naɪs deɪ/", category: "课堂表达", emoji: "☀️", scene: "linear-gradient(135deg, #fff6d6, #ffe8a6)", hint: "出门告别时很常见的一句话。" }
    ];

    const categories = ["全部", ...new Set(words.map(item => item.category))];
    const searchInput = document.getElementById("searchInput");
    const categoryChips = document.getElementById("categoryChips");
    const wordList = document.getElementById("wordList");
    const autoSpeak = document.getElementById("autoSpeak");
    const autoSpeakQuiz = document.getElementById("autoSpeakQuiz");
    const alwaysShowMeaning = document.getElementById("alwaysShowMeaning");
    const listPanel = document.querySelector(".list-panel");
    const toggleWordListBtn = document.getElementById("toggleWordListBtn");
    const settingsPanel = document.getElementById("settingsPanel");
    const settingsSummary = document.getElementById("settingsSummary");
    const toggleSettingsBtn = document.getElementById("toggleSettingsBtn");
    const focusSettingsBtn = document.getElementById("focusSettingsBtn");
    const focusCardBtn = document.getElementById("focusCardBtn");
    const focusQuizBtn = document.getElementById("focusQuizBtn");
    const focusListBtn = document.getElementById("focusListBtn");
    const cardSection = document.getElementById("cardSection");
    const quizSection = document.getElementById("quizSection");
    const listSection = document.getElementById("listSection");

    const totalCount = document.getElementById("totalCount");
    const shownCount = document.getElementById("shownCount");
    const currentIndexLabel = document.getElementById("currentIndexLabel");
    const categoryLabel = document.getElementById("categoryLabel");
    const scene = document.getElementById("scene");
    const emojiBox = document.getElementById("emojiBox");
    const wordText = document.getElementById("wordText");
    const phoneticText = document.getElementById("phoneticText");
    const meaningText = document.getElementById("meaningText");
    const hintText = document.getElementById("hintText");

    const quizWord = document.getElementById("quizWord");
    const quizAnswer = document.getElementById("quizAnswer");

    let selectedCategory = "全部";
    let keyword = "";
    let filteredWords = [...words];
    let currentIndex = 0;
    let meaningVisible = false;
    let voicesReady = false;
    let cachedVoices = [];
    let settingsOpen = false;
    let wordListOpen = true;
    let soloSection = null;

    function setSettingsOpen(open) {
      settingsOpen = open;
      settingsPanel.classList.toggle("open", settingsOpen);
      toggleSettingsBtn.textContent = settingsOpen ? "收起设置" : "学习设置";
    }

    function setWordListOpen(open) {
      wordListOpen = open;
      listPanel.classList.toggle("collapsed", !wordListOpen);
      toggleWordListBtn.textContent = wordListOpen ? "收起" : "展开";
    }

    function updateSoloButtons() {
      focusSettingsBtn.textContent = soloSection === "settings" ? "显示全部" : "只看此板块";
      focusCardBtn.textContent = soloSection === "card" ? "显示全部" : "只看此板块";
      focusQuizBtn.textContent = soloSection === "quiz" ? "显示全部" : "只看此板块";
      focusListBtn.textContent = soloSection === "list" ? "显示全部" : "只看此板块";
    }

    function setSoloSection(section) {
      soloSection = soloSection === section ? null : section;
      settingsPanel.classList.toggle("solo-hidden", !!soloSection && soloSection !== "settings");
      cardSection.classList.toggle("solo-hidden", !!soloSection && soloSection !== "card");
      quizSection.classList.toggle("solo-hidden", !!soloSection && soloSection !== "quiz");
      listSection.classList.toggle("solo-hidden", !!soloSection && soloSection !== "list");
      updateSoloButtons();
    }

    function syncMeaningMode(resetIfNeeded = false) {
      if (alwaysShowMeaning.checked) {
        meaningVisible = true;
      } else if (resetIfNeeded) {
        meaningVisible = false;
      }
      document.getElementById("flipBtn").textContent = meaningVisible ? "藏起来" : "看答案";
    }

    function setupVoices() {
      cachedVoices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      voicesReady = cachedVoices.length > 0;
    }

    if ("speechSynthesis" in window) {
      setupVoices();
      speechSynthesis.onvoiceschanged = setupVoices;
    }

    function getBestVoice() {
      if (!cachedVoices.length) return null;
      return (
        cachedVoices.find(v => /en-(gb|us)/i.test(v.lang) && /Google|Samantha|Daniel|Serena/i.test(v.name)) ||
        cachedVoices.find(v => /en/i.test(v.lang)) ||
        cachedVoices[0]
      );
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        alert("当前浏览器不支持语音朗读。建议用 Chrome 打开。");
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      const voice = getBestVoice();
      if (voice) utterance.voice = voice;
      utterance.lang = voice?.lang || "en-US";
      utterance.rate = 0.86;
      utterance.pitch = 1.05;
      utterance.volume = 1;
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    function normalize(value) {
      return value.toLowerCase().trim();
    }

    function getFilteredWords() {
      const q = normalize(keyword);
      return words.filter(item => {
        const categoryOk = selectedCategory === "全部" || item.category === selectedCategory;
        const searchOk = !q || item.en.toLowerCase().includes(q) || item.zh.includes(q) || item.phonetic.toLowerCase().includes(q);
        return categoryOk && searchOk;
      });
    }

    function updateStats() {
      totalCount.textContent = words.length;
      shownCount.textContent = filteredWords.length;
      currentIndexLabel.textContent = filteredWords.length ? `${currentIndex + 1} / ${filteredWords.length}` : "0 / 0";
    }

    function renderCategoryChips() {
      categoryChips.innerHTML = "";
      categories.forEach(category => {
        const chip = document.createElement("button");
        chip.className = `chip${selectedCategory === category ? " active" : ""}`;
        chip.textContent = category;
        chip.addEventListener("click", () => {
          selectedCategory = category;
          filteredWords = getFilteredWords();
          currentIndex = 0;
          syncMeaningMode(true);
          renderAll();
        });
        categoryChips.appendChild(chip);
      });
    }

    function renderWordList() {
      wordList.innerHTML = "";
      if (!filteredWords.length) {
        const empty = document.createElement("div");
        empty.className = "mini-note";
        empty.textContent = "没有找到匹配的单词，试试换个关键词。";
        wordList.appendChild(empty);
        return;
      }

      filteredWords.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = `word-pill${index === currentIndex ? " active" : ""}`;
        button.innerHTML = `<strong>${item.en}</strong><span>${item.zh}</span>`;
        button.addEventListener("click", () => {
          currentIndex = index;
          syncMeaningMode(true);
          renderCard();
          renderWordList();
          updateStats();
          maybeSpeakCurrent();
        });
        wordList.appendChild(button);
      });
    }

    function renderCard() {
      const item = filteredWords[currentIndex];
      if (!item) {
        categoryLabel.textContent = "没有结果";
        scene.style.setProperty("--scene-bg", "linear-gradient(135deg, #f0f0f0, #fafafa)");
        emojiBox.textContent = "🔍";
        wordText.textContent = "No match";
        phoneticText.textContent = "";
        meaningText.textContent = "没有找到匹配的单词";
        hintText.textContent = "试试清空搜索或切换分类。";
        return;
      }

      categoryLabel.textContent = `${item.category} · #${item.id}`;
      scene.style.setProperty("--scene-bg", item.scene);
      emojiBox.textContent = item.emoji;
      wordText.textContent = item.en;
      phoneticText.textContent = item.phonetic;
      meaningText.textContent = meaningVisible ? item.zh : "先自己想一想中文意思";
      hintText.textContent = meaningVisible ? item.hint : "先听一听发音，再猜猜它的中文意思。";
    }

    function renderAll() {
      filteredWords = getFilteredWords();
      if (currentIndex >= filteredWords.length) currentIndex = 0;
      syncMeaningMode();
      renderCategoryChips();
      renderCard();
      renderWordList();
      updateStats();
    }

    function maybeSpeakCurrent(force = false) {
      if (!force && !autoSpeak.checked) return;
      const item = filteredWords[currentIndex];
      if (item) speak(item.en);
    }

    function move(step) {
      if (!filteredWords.length) return;
      currentIndex = (currentIndex + step + filteredWords.length) % filteredWords.length;
      syncMeaningMode(true);
      renderCard();
      renderWordList();
      updateStats();
      maybeSpeakCurrent(true);
    }

    function randomPick() {
      if (!filteredWords.length) return;
      currentIndex = Math.floor(Math.random() * filteredWords.length);
      syncMeaningMode(true);
      renderCard();
      renderWordList();
      updateStats();
      maybeSpeakCurrent(true);
    }

    function makeQuiz() {
      if (!filteredWords.length) return;
      const item = filteredWords[Math.floor(Math.random() * filteredWords.length)];
      quizWord.textContent = item.en;
      quizAnswer.textContent = "";
      quizAnswer.dataset.answer = `${item.zh} ${item.phonetic}`;
      quizAnswer.dataset.word = item.en;
      if (autoSpeakQuiz.checked) speak(item.en);
    }

    searchInput.addEventListener("input", (event) => {
      keyword = event.target.value;
      currentIndex = 0;
      syncMeaningMode(true);
      renderAll();
    });

    alwaysShowMeaning.addEventListener("change", () => {
      syncMeaningMode();
      renderCard();
    });

    settingsSummary.addEventListener("click", () => {
      setSettingsOpen(!settingsOpen);
    });

    toggleSettingsBtn.addEventListener("click", () => {
      setSettingsOpen(!settingsOpen);
    });

    focusSettingsBtn.addEventListener("click", () => {
      setSoloSection("settings");
    });

    focusCardBtn.addEventListener("click", () => {
      setSoloSection("card");
    });

    focusQuizBtn.addEventListener("click", () => {
      setSoloSection("quiz");
    });

    focusListBtn.addEventListener("click", () => {
      setSoloSection("list");
    });

    toggleWordListBtn.addEventListener("click", () => {
      setWordListOpen(!wordListOpen);
    });

    document.getElementById("prevBtn").addEventListener("click", () => move(-1));
    document.getElementById("nextBtn").addEventListener("click", () => move(1));
    document.getElementById("randomBtn").addEventListener("click", randomPick);
    document.getElementById("speakBtn").addEventListener("click", () => {
      const item = filteredWords[currentIndex];
      if (item) speak(item.en);
    });

    document.getElementById("flipBtn").addEventListener("click", () => {
      meaningVisible = !meaningVisible;
      if (alwaysShowMeaning.checked) {
        meaningVisible = true;
      }
      syncMeaningMode();
      renderCard();
    });

    document.getElementById("quizBtn").addEventListener("click", makeQuiz);
    document.getElementById("showQuizAnswerBtn").addEventListener("click", () => {
      quizAnswer.textContent = quizAnswer.dataset.answer || "先出一道题。";
    });
    document.getElementById("speakQuizBtn").addEventListener("click", () => {
      const word = quizAnswer.dataset.word || quizWord.textContent;
      if (word && word !== "按“来一题小测验”开始") speak(word);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
      if (event.key.toLowerCase() === "s") {
        const item = filteredWords[currentIndex];
        if (item) speak(item.en);
      }
    });

    renderAll();
    makeQuiz();
    syncMeaningMode();
    setSettingsOpen(false);
    setWordListOpen(true);
    updateSoloButtons();
    if (voicesReady) {
      setTimeout(maybeSpeakCurrent, 500);
    }
  </script>
</body>
</html>
